name: resiq
description: ResIQ — Property Management System for Vacation Rentals
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Routing
  go_router: ^14.2.0
  # Backend
  supabase_flutter: ^2.5.0
  firebase_core: ^2.31.0
  firebase_auth: ^4.19.0
  # UI
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  # Utilities
  url_launcher: ^6.2.6
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  timeago: ^3.6.1
  currency_formatter: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/
